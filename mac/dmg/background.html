<!doctype html><html><head><meta charset="utf-8">
<!-- The Mac installer window's background (640 × 428; render at 1x and 2x to background.png / background@2x.png).
     Finder draws the icons at (170, 196) and (470, 196) and their names below them in black, and may cover the
     bottom 28 px with its path bar: nothing that matters lives there. -->
<style>
@font-face { font-family: Geist; src: url(../../site/public/fonts/geist-100_900-normal.woff2) format('woff2'); font-weight: 100 900; }
html, body { margin: 0; padding: 0; }
body { width: 640px; height: 428px; overflow: hidden; font-family: Geist, -apple-system, sans-serif; color: #121218; position: relative;
  -webkit-font-smoothing: antialiased;
  background: linear-gradient(180deg, #f6f4fb 0%, #fbfaff 46%, #f4f3f8 100%); }
.glow { position: absolute; left: 50%; top: -170px; width: 720px; height: 380px; transform: translateX(-50%);
  background:
    radial-gradient(22% 24% at 50% 50%, rgba(255,255,255,0.9), transparent 70%),
    radial-gradient(34% 36% at 50% 48%, rgba(242,107,217,0.26), transparent 72%),
    radial-gradient(52% 52% at 50% 50%, rgba(133,97,255,0.30), transparent 72%),
    radial-gradient(76% 64% at 50% 52%, rgba(64,158,255,0.12), transparent 75%);
  filter: blur(4px); }
.notch { position: absolute; left: 50%; top: 0; width: 168px; height: 28px; transform: translateX(-50%); background: #050507;
  border-radius: 0 0 15px 15px; box-shadow: 0 8px 28px rgba(133,97,255,0.38), 0 2px 6px rgba(0,0,0,0.25); }
.cam { position: absolute; left: 50%; top: 10px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #4a5078, #0b0c14 70%); }
.title { position: absolute; top: 50px; width: 100%; text-align: center; font-size: 25px; font-weight: 680; letter-spacing: -0.035em; }
.sub { position: absolute; top: 84px; width: 100%; text-align: center; font-size: 13px; font-weight: 450; color: rgba(18,18,24,0.58); }
/* a soft floor shadow under each icon */
.floor { position: absolute; top: 246px; width: 120px; height: 16px; border-radius: 50%;
  background: radial-gradient(50% 50% at 50% 50%, rgba(60,40,140,0.16), transparent 75%); }
.f1 { left: 110px; } .f2 { left: 410px; }
svg { position: absolute; left: 0; top: 0; }
.foot { position: absolute; top: 330px; width: 100%; text-align: center; font-size: 11.5px; color: rgba(18,18,24,0.55); line-height: 1.55; }
.foot b { color: rgba(18,18,24,0.82); font-weight: 600; }
.brand { position: absolute; top: 374px; width: 100%; text-align: center; font-size: 10.5px; color: rgba(18,18,24,0.34); letter-spacing: 0.01em; }
</style></head><body>
<div class="glow"></div>
<div class="notch"><div class="cam"></div></div>
<div class="title">TapDrop</div>
<div class="sub">Drag TapDrop into Applications</div>
<div class="floor f1"></div><div class="floor f2"></div>
<svg width="640" height="428" viewBox="0 0 640 428">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#8561ff"/><stop offset="0.55" stop-color="#b36bf2"/><stop offset="1" stop-color="#f26bd9"/></linearGradient>
  </defs>
  <path d="M262 194 C 302 168, 338 168, 378 194" fill="none" stroke="url(#g)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="0.5 9"/>
  <path d="M365 184 L 380 196 L 362 201" fill="none" stroke="#f26bd9" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div class="foot">Then open <b>TapDrop</b> from Applications. The first time, macOS asks once:<br>
<b>System Settings → Privacy &amp; Security → Open Anyway</b></div>
<div class="brand">Free and open source · tapdrop.pages.dev</div>
</body></html>
