<!doctype html><html><head><meta charset="utf-8">
<!-- The Mac installer window's background (640 × 428; render at 1x and 2x to background.png / background@2x.png).
     Lumen, light: bone, the notch at the top with the Notchline lit under it, the wordmark, and a hairline arrow.
     Finder draws the icons at (170, 196) and (470, 196) and their names below them, and may cover the bottom 28 px
     with its path bar: nothing that matters lives there. -->
<style>
@font-face { font-family: Geist; src: url(../Resources/Fonts/Geist.ttf) format('truetype'); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url(../Resources/Fonts/GeistMono.ttf) format('truetype'); font-weight: 100 900; }
@font-face { font-family: "Instrument Serif"; font-style: italic; src: url(../Resources/Fonts/InstrumentSerif-Italic.ttf) format('truetype'); }
html, body { margin: 0; padding: 0; }
body { width: 640px; height: 428px; overflow: hidden; font-family: Geist, -apple-system, sans-serif; color: #0B0B0D; position: relative;
  -webkit-font-smoothing: antialiased;
  background: linear-gradient(180deg, #F7F6F2 0%, #F4F3EF 55%, #EFEDE7 100%); }
/* the notch's light: a white pool under it */
.pool { position: absolute; left: 50%; top: -150px; width: 560px; height: 300px; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,255,255,1), rgba(255,255,255,0.55) 45%, rgba(255,255,255,0)); }
.notch { position: absolute; left: 50%; top: 0; width: 150px; height: 24px; transform: translateX(-50%); background: #08080A;
  border-radius: 0 0 13px 13px; box-shadow: 0 6px 22px rgba(0,0,0,0.16); }
.cam { position: absolute; left: 50%; top: 8px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #3a3a40, #0b0b0e 70%); }
.mark { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); }
.title { position: absolute; top: 66px; width: 100%; text-align: center; font-size: 30px; letter-spacing: -0.035em; line-height: 1; }
.title .tap { font-weight: 600; }
.title .drop { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
.sub { position: absolute; top: 104px; width: 100%; text-align: center; font-size: 13px; font-weight: 450; color: rgba(11,11,13,0.56); }
/* a soft floor shadow under each icon */
.floor { position: absolute; top: 248px; width: 120px; height: 14px; border-radius: 50%;
  background: radial-gradient(50% 50% at 50% 50%, rgba(11,11,13,0.13), transparent 75%); }
.f1 { left: 110px; } .f2 { left: 410px; }
svg.arrow { position: absolute; left: 0; top: 0; }
.foot { position: absolute; top: 322px; width: 100%; text-align: center; font-size: 11.5px; color: rgba(11,11,13,0.55); line-height: 1.6; }
.foot b { color: rgba(11,11,13,0.86); font-weight: 600; }
.brand { position: absolute; top: 370px; width: 100%; text-align: center; font-family: "Geist Mono", ui-monospace, monospace; font-size: 9.5px;
  letter-spacing: 0.16em; text-transform: uppercase; color: rgba(11,11,13,0.36); }
</style></head><body>
<div class="pool"></div>
<div class="notch"><div class="cam"></div></div>
<svg class="mark" width="110" height="22" viewBox="12 32 76 24" aria-hidden="true">
  <defs><filter id="h" x="-20%" y="-150%" width="140%" height="400%"><feGaussianBlur stdDeviation="2.4"/></filter></defs>
  <path d="M16 38H34C37 38 38.5 39.5 38.5 42.5V43.5C38.5 47 41 49.5 44.5 49.5H55.5C59 49.5 61.5 47 61.5 43.5V42.5C61.5 39.5 63 38 66 38H84" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#h)"/>
  <path d="M16 38H34C37 38 38.5 39.5 38.5 42.5V43.5C38.5 47 41 49.5 44.5 49.5H55.5C59 49.5 61.5 47 61.5 43.5V42.5C61.5 39.5 63 38 66 38H84" fill="none" stroke="#0B0B0D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div class="title"><span class="tap">Tap</span><span class="drop">Drop</span></div>
<div class="sub">Drag TapDrop into Applications</div>
<div class="floor f1"></div><div class="floor f2"></div>
<svg class="arrow" width="640" height="428" viewBox="0 0 640 428" aria-hidden="true">
  <path d="M266 196 C 300 174, 340 174, 374 196" fill="none" stroke="rgba(11,11,13,0.55)" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M368.7 186.4 L 374 196 L 363 195.1" fill="none" stroke="rgba(11,11,13,0.55)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div class="foot">Then open <b>TapDrop</b> from Applications. The first time, macOS asks once:<br>
<b>System Settings → Privacy &amp; Security → Open Anyway</b></div>
<div class="brand">Free and open source · tapdrop.pages.dev</div>
</body></html>
