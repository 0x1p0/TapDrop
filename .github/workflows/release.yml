name: Release

# Pushing a tag like v2.1.0 builds both apps, signs them and publishes a GitHub release: the downloads, their
# checksums and that version's notes from CHANGELOG.md. The apps' updaters read the latest release once a day.
# Running it by hand (Actions → Release → Run workflow) builds everything and keeps the files as a build artifact;
# tick "publish" to release the version in VERSION.
#
# Secrets (Settings → Secrets and variables → Actions):
#   MAC_SIGNING_P12_BASE64, MAC_SIGNING_P12_PASSWORD   the Mac release identity, "TapDrop Release Signing"
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD   the Android release key

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (otherwise only build it)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Version and notes
        id: version
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$V" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match VERSION ($V)."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          scripts/release-notes.sh "$V" > "$RUNNER_TEMP/NOTES.md"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - name: Android release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::The Android release key secrets aren't set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/tapdrop.keystore
          {
            echo "storeFile=tapdrop.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Mac release identity
        env:
          P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          if [[ -z "$P12_BASE64" ]]; then
            echo "::error::The Mac release identity secrets aren't set."
            exit 1
          fi
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/mac-signing.p12"
          echo "TAPDROP_MAC_P12=$RUNNER_TEMP/mac-signing.p12" >> "$GITHUB_ENV"
          echo "TAPDROP_MAC_P12_PASSWORD=$P12_PASSWORD" >> "$GITHUB_ENV"

      - name: dmgbuild (lays out the Mac installer window)
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7
          echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"

      - name: Build the downloads (and check both are signed like every earlier release)
        run: scripts/release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: TapDrop-${{ steps.version.outputs.version }}
          path: release/
          retention-days: 14

      - name: Publish
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$V" release/TapDrop-* release/SHA256SUMS.txt \
            --title "TapDrop $V" --notes-file release/NOTES.md --target "$GITHUB_SHA" --latest

      - name: Clean up the keys
        if: always()
        run: rm -f android/tapdrop.keystore android/keystore.properties "$RUNNER_TEMP/mac-signing.p12"
