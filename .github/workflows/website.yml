name: Website

# Builds site/ and deploys it to Cloudflare Pages, https://tapdrop.pages.dev (its own Pages project, "tapdrop"),
# whenever it changes on main.
#
# Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_ACCOUNT_ID   the Cloudflare account that owns the project
#   CLOUDFLARE_API_TOKEN    a token with only Account → Cloudflare Pages → Edit, for that account

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: website
      url: https://tapdrop.pages.dev
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (see the top of this file)."
            exit 1
          fi
          npx wrangler pages deploy --branch main --commit-hash "$GITHUB_SHA"
